name: "Setup uv"
description: "Install uv and sync project dependencies"
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Sync dependencies
      run: uv sync --frozen
      shell: bash
