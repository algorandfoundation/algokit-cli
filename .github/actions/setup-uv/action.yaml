name: "Setup uv"
description: "Install uv and sync project dependencies"
inputs:
  extra-sync-args:
    description: "Additional arguments to pass to uv sync (e.g. --group docs)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.10.x"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Sync dependencies
      run: uv sync --frozen ${{ inputs.extra-sync-args }}
      shell: bash
